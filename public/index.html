<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bomb It Multiplayer Web</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0; background: #222; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    
    #lobby { text-align: center; background: #333; padding: 30px; border-radius: 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    .lobby-btn { padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; margin: 10px 0; width: 100%; transition: 0.2s;}
    .btn-create { background: #e74c3c; color: white; }
    .btn-create:hover { background: #c0392b; }
    .btn-join { background: #0984e3; color: white; }
    .btn-join:hover { background: #74b9ff; }
    #room-input { padding: 12px; font-size: 16px; border-radius: 8px; border: none; width: 100%; text-align: center; text-transform: uppercase; margin-bottom: 10px;}
    
    #room-info { display: none; }
    #room-info img { width: 180px; height: 180px; border-radius: 8px; margin: 10px 0; }

    #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
    
    #hud {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      background: #444; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px;
      font-size: 15px; font-weight: bold; border: 3px solid #333;
    }
    #hud-stats { display: flex; gap: 8px; }
    .buff-count { font-size: 12px; color: #55efc4; margin-left: 2px; }
    #hud-room-code { font-size: 12px; color: #f1c40f; text-align: center; }
    
    .btn-restart {
      background: #00b894; color: white; border: none; padding: 6px 10px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;
    }
    .btn-restart:active { background: #00cec9; }
    
    canvas { border: 4px solid #333; border-radius: 8px; max-width: 90vw; }
    
    .controls { display: grid; grid-template-columns: repeat(4, 50px); grid-gap: 8px; margin-top: 10px; justify-content: center; }
    .btn {
      width: 50px; height: 50px; background: #444; border: none; border-radius: 10px;
      color: #fff; font-size: 18px; font-weight: bold; display: flex; align-items: center;
      justify-content: center; user-select: none; cursor: pointer;
    }
    .btn:active { background: #666; }
    .btn-bomb { background: #e74c3c; grid-column: 2; }
    .btn-shoot { background: #0984e3; font-size: 20px; }
    .btn-mine { background: #9b59b6; font-size: 20px; } 

    #victory-banner {
      display: none; position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9); padding: 30px 50px; border-radius: 15px; border: 4px solid #f1c40f;
      text-align: center; font-size: 24px; color: #f1c40f; z-index: 100;
    }
  </style>
</head>
<body>

  <div id="lobby">
    <h2>🎮 BOMB IT WEB 🎮</h2>
    <div id="room-selection">
      <button class="lobby-btn btn-create" onclick="createRoom()">Tạo Phòng Mới</button>
      <div style="margin: 20px 0; font-size: 14px; color: #aaa;">HOẶC</div>
      <input type="text" id="room-input" placeholder="NHẬP MÃ PHÒNG" maxlength="6" />
      <button class="lobby-btn btn-join" onclick="joinRoom()">Vào Phòng</button>
    </div>
    <div id="room-info">
      <p>Mã Phòng: <span id="room-display" style="font-weight: bold; color: #f1c40f; font-size: 24px;"></span></p>
      <img id="qr-img" alt="QR Code" />
      <p style="font-size: 12px; color: #bbb;">Gửi mã này cho bạn bè hoặc quét QR</p>
      <button class="lobby-btn btn-join" onclick="startGame()">▶ Bắt Đầu Ngay</button>
    </div>
  </div>

  <div id="game-container">
    <div id="victory-banner">🎉 BẠN ĐÃ CHIẾN THẮNG! 🎉</div>
    <div id="hud">
      <div id="hud-stats"></div>
      <div id="hud-room-code">Phòng:<br><span id="hud-room-id"></span></div>
      <button class="btn-restart" onclick="sendRestart()">🔄 Chơi Lại</button>
    </div>

    <canvas id="canvas" width="600" height="520"></canvas>
    
    <div class="controls">
      <div></div><button class="btn" onclick="sendMove('up')">▲</button><div></div>
      <button class="btn btn-mine" onclick="sendMine()">🔘</button>
      <button class="btn" onclick="sendMove('left')">◀</button>
      <button class="btn btn-bomb" onclick="sendBomb()">💣</button>
      <button class="btn" onclick="sendMove('right')">▶</button>
      <button class="btn btn-shoot" onclick="sendShoot()">⚡</button>
      <div></div><button class="btn" onclick="sendMove('down')">▼</button><div></div>
    </div>
  </div>

  <script>
    const bgm = new Audio('/assets/bgm.mp3'); bgm.loop = true; bgm.volume = 0.5;
    const sfxVictory = new Audio('/assets/victory.mp3'); sfxVictory.volume = 0.7;
    const sfxBomb = new Audio('/assets/bomb.mp3'); sfxBomb.volume = 0.3;
    const sfxLaser = new Audio('/assets/laser.mp3'); sfxLaser.volume = 0.3;
    const sfxMine = new Audio('/assets/mine.mp3'); sfxMine.volume = 0.3;

    function playSound(audioEl) {
      audioEl.currentTime = 0;
      audioEl.play().catch(e => console.log("Trình duyệt chặn Audio"));
    }

    const imgWall = new Image(); imgWall.src = '/assets/wall.png';
    const imgBrick = new Image(); imgBrick.src = '/assets/brick.png';
    const imgBomb = new Image(); imgBomb.src = '/assets/bomb.png';
    const imgItemBomb = new Image(); imgItemBomb.src = '/assets/item-bomb.png';
    const imgItemFire = new Image(); imgItemFire.src = '/assets/item-fire.png';
    const imgItemGun = new Image(); imgItemGun.src = '/assets/item-gun.png';
    const imgLaser = new Image(); imgLaser.src = '/assets/laser.png'; 
    const imgItemMine = new Image(); imgItemMine.src = '/assets/item-mine.png'; 
    const imgTrapMine = new Image(); imgTrapMine.src = '/assets/trap-mine.png'; 
    const imgItemShield = new Image(); imgItemShield.src = '/assets/item-shield.png';
    const imgGrass = new Image(); imgGrass.src = '/assets/grass.png';

    const imgPlayer1 = new Image(); imgPlayer1.src = '/assets/player1.png';
    const imgPlayer2 = new Image(); imgPlayer2.src = '/assets/player2.png';
    const imgPlayer3 = new Image(); imgPlayer3.src = '/assets/player3.png';
    const imgPlayer4 = new Image(); imgPlayer4.src = '/assets/player4.png';

    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');

    if (roomId) {
      document.getElementById('room-selection').style.display = 'none';
      document.getElementById('room-info').style.display = 'block';
      socket.emit('join_room', { roomId, hostUrl: window.location.origin });
    }

    function createRoom() {
      roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
      window.history.pushState({}, '', `?room=${roomId}`);
      document.getElementById('room-selection').style.display = 'none';
      document.getElementById('room-info').style.display = 'block';
      socket.emit('join_room', { roomId, hostUrl: window.location.origin });
    }

    function joinRoom() {
      const input = document.getElementById('room-input').value.trim().toUpperCase();
      if (!input) return alert('Vui lòng nhập mã phòng!');
      roomId = input;
      window.history.pushState({}, '', `?room=${roomId}`);
      document.getElementById('room-selection').style.display = 'none';
      document.getElementById('room-info').style.display = 'block';
      socket.emit('join_room', { roomId, hostUrl: window.location.origin });
    }

    socket.on('room_full', () => {
      alert('Rất tiếc! Phòng này đã đủ 4 người chơi.');
      window.location.href = '/'; 
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CELL_SIZE = 40;

    // TỐI ƯU 1: Biến lưu trữ Canvas nền để không phải vẽ lại cỏ mỗi khung hình
    const bgCanvas = document.createElement('canvas');
    bgCanvas.width = 600; 
    bgCanvas.height = 520;
    const bgCtx = bgCanvas.getContext('2d');
    let isBgRendered = false;

    let gameState = { map: [], players: {}, bombs: [], explosions: [], lasers: [], mines: [], laserDir: 'down' };

    function updateHUD() {
      const myPlayer = gameState.players[socket.id];
      if (myPlayer) {
        if (myPlayer.alive) {
          const bombCharge = myPlayer.bombBuffCharges > 0 ? `<span class="buff-count">(${myPlayer.bombBuffCharges})</span>` : '';
          const fireCharge = myPlayer.fireBuffCharges > 0 ? `<span class="buff-count">(${myPlayer.fireBuffCharges})</span>` : '';

          document.getElementById('hud-stats').innerHTML = `
            <div>❤️<span>${myPlayer.lives}</span></div>
            <div>🛡️<span style="color:${myPlayer.hasShield ? '#3498db' : '#fff'}">${myPlayer.hasShield ? '1' : '0'}</span></div>
            <div>💣<span>${myPlayer.bombLimit}</span>${bombCharge}</div>
            <div>🔥<span>${myPlayer.bombPower}</span>${fireCharge}</div>
            <div style="color:#00cec9;">⚡<span>${myPlayer.hasElectricGun}</span></div>
            <div style="color:#9b59b6;">🔘<span>${myPlayer.hasMine}</span></div>
          `;
        } else {
          document.getElementById('hud-stats').innerHTML = "<div style='color:#ff7675;'>💀 TỬ TRẬN</div>";
        }
      }
    }

    socket.on('room_state', (data) => {
      document.getElementById('qr-img').src = data.qrCode;
      document.getElementById('room-display').innerText = data.roomId;
      document.getElementById('hud-room-id').innerText = data.roomId;
      gameState.map = data.map;
      gameState.players = data.players;
      gameState.mines = data.mines || [];
      updateHUD();
    });

    socket.on('game_restarted', (data) => {
      gameState.map = data.map;
      gameState.players = data.players;
      gameState.mines = data.mines || [];
      gameState.bombs = [];       
      gameState.explosions = [];
      gameState.lasers = [];
      
      document.getElementById('endgame-banner').style.display = 'none';
      sfxVictory.pause();
      sfxVictory.currentTime = 0;
      playSound(bgm);
      
      updateHUD();                
    });

    socket.on('player_moved', ({ id, x, y }) => {});
    socket.on('player_updated', (updatedPlayer) => {
      gameState.players[updatedPlayer.id] = updatedPlayer;
      if (updatedPlayer.id === socket.id) updateHUD();
    });
    socket.on('map_updated', (updatedMap) => { gameState.map = updatedMap; });
    socket.on('bomb_placed', (bomb) => { gameState.bombs.push(bomb); });

    socket.on('bomb_exploded', ({ bombId, explosionCells, updatedMap, players, mines }) => {
      playSound(sfxBomb);
      gameState.bombs = gameState.bombs.filter(b => b.id !== bombId);
      gameState.map = updatedMap;
      gameState.players = players;
      gameState.mines = mines;
      gameState.explosions = explosionCells;
      updateHUD(); 
      setTimeout(() => { gameState.explosions = []; }, 400);
    });

    socket.on('mine_placed', (mine) => { gameState.mines.push(mine); });

    socket.on('mine_exploded', ({ explosionCells, players, mines }) => {
      playSound(sfxMine);
      gameState.players = players;
      gameState.mines = mines;
      gameState.explosions = explosionCells;
      updateHUD();
      setTimeout(() => { gameState.explosions = []; }, 400);
    });

    socket.on('laser_fired', ({ laserCells, direction, players }) => {
      playSound(sfxLaser);
      gameState.players = players;
      gameState.lasers = laserCells;
      gameState.laserDir = direction;
      updateHUD();
      setTimeout(() => { gameState.lasers = []; }, 300); 
    });

    socket.on('game_over', ({ winnerId }) => {
      bgm.pause();
      const banner = document.getElementById('endgame-banner');
      const title = document.getElementById('endgame-title');
      const img = document.getElementById('endgame-img');
      const subtitle = document.getElementById('endgame-subtitle');
      
      banner.style.display = 'block';

      if (winnerId && gameState.players[winnerId]) {
        const winner = gameState.players[winnerId];
        img.src = '/assets/player' + winner.playerNumber + '.png';
        img.style.display = 'inline-block';

        if (winnerId === socket.id) {
          playSound(sfxVictory);
          banner.className = 'win-border';
          title.innerHTML = '🎉 VICTORY! 🎉';
          title.style.color = '#f1c40f';
          subtitle.innerHTML = 'Bạn là người sống sót cuối cùng!';
        } else {
          banner.className = 'lose-border';
          title.innerHTML = '💀 DEFEAT! 💀';
          title.style.color = '#e74c3c';
          subtitle.innerHTML = `Kẻ chiến thắng là Player ${winner.playerNumber}`;
        }
      } else {
        banner.className = 'win-border';
        title.innerHTML = '🤝 HÒA NHAU 🤝';
        title.style.color = '#fff';
        img.style.display = 'none';
        subtitle.innerHTML = 'Không còn ai sống sót...';
      }
    });

    // TỐI ƯU 2: Bộ lọc chống spam phím khi đè nút di chuyển
    let lastMoveTime = 0;
    function sendMove(dir) { 
      const now = Date.now();
      if (now - lastMoveTime < 80) return; // Chỉ cho phép di chuyển tối đa ~12 lần/giây
      lastMoveTime = now;
      socket.emit('move', { roomId, dir }); 
    }

    function sendBomb() { socket.emit('place_bomb', { roomId }); }
    function sendShoot() { socket.emit('shoot_gun', { roomId }); } 
    function sendMine() { socket.emit('place_mine', { roomId }); } 
    function sendRestart() { socket.emit('restart_game', { roomId }); }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') sendMove('up');
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') sendMove('down');
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') sendMove('left');
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') sendMove('right');
      if (e.key === ' ' || e.key === 'Enter') sendBomb();
      if (e.key === 'e' || e.key === 'E') sendShoot();
      if (e.key === 'q' || e.key === 'Q') sendMine();
    });

    function startGame() {
      playSound(bgm);
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      updateHUD();
      requestAnimationFrame(render);
    }

    function drawSafe(img, x, y, w, h) {
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
      } else {
        let color = '#e84118';
        if (img === imgItemGun) color = '#00cec9';
        else if (img === imgItemMine || img === imgTrapMine) color = '#9b59b6';
        else if (img === imgItemShield) color = '#3498db'; 
        
        ctx.fillStyle = color;
        ctx.fillRect(x, y, w, h);
      }
    }

    function drawAimArrow(x, y, dir) {
      ctx.fillStyle = '#f1c40f'; 
      ctx.beginPath();
      const cx = x * CELL_SIZE + CELL_SIZE / 2;
      const cy = y * CELL_SIZE + CELL_SIZE / 2;
      const offset = 18; 
      
      if (dir === 'up') {
        ctx.moveTo(cx, cy - offset - 10);
        ctx.lineTo(cx - 8, cy - offset);
        ctx.lineTo(cx + 8, cy - offset);
      } else if (dir === 'down') {
        ctx.moveTo(cx, cy + offset + 10);
        ctx.lineTo(cx - 8, cy + offset);
        ctx.lineTo(cx + 8, cy + offset);
      } else if (dir === 'left') {
        ctx.moveTo(cx - offset - 10, cy);
        ctx.lineTo(cx - offset, cy - 8);
        ctx.lineTo(cx - offset, cy + 8);
      } else if (dir === 'right') {
        ctx.moveTo(cx + offset + 10, cy);
        ctx.lineTo(cx + offset, cy - 8);
        ctx.lineTo(cx + offset, cy + 8);
      }
      ctx.fill();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // TỐI ƯU 3: Chỉ vẽ background cỏ đúng 1 lần duy nhất vào bộ nhớ tạm
      if (!isBgRendered && imgGrass.complete) {
        for (let r = 0; r < 13; r++) {
          for (let c = 0; c < 15; c++) {
            bgCtx.drawImage(imgGrass, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        }
        isBgRendered = true;
      }

      // Đổ nền cỏ lên màn hình (chỉ 1 lệnh vẽ thay vì 195 lệnh)
      if (isBgRendered) {
        ctx.drawImage(bgCanvas, 0, 0);
      } else {
        ctx.fillStyle = '#78e08f';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      for (let r = 0; r < gameState.map.length; r++) {
        for (let c = 0; c < gameState.map[r].length; c++) {
          const tile = gameState.map[r][c];
          // Bỏ hàm vẽ imgGrass ở đây để tiết kiệm tài nguyên
          
          if (tile === 1) drawSafe(imgWall, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 2) drawSafe(imgBrick, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 3) drawSafe(imgItemBomb, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 4) drawSafe(imgItemFire, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 5) drawSafe(imgItemGun, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE); 
          else if (tile === 6) drawSafe(imgItemMine, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE); 
          else if (tile === 7) drawSafe(imgItemShield, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE); 
        }
      }

      gameState.mines.forEach(m => {
        drawSafe(imgTrapMine, m.x * CELL_SIZE, m.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      gameState.bombs.forEach(b => {
        drawSafe(imgBomb, b.x * CELL_SIZE, b.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      ctx.fillStyle = 'rgba(255, 118, 117, 0.8)';
      gameState.explosions.forEach(exp => {
        ctx.fillRect(exp.x * CELL_SIZE, exp.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      gameState.lasers.forEach(cell => {
        const cx = cell.x * CELL_SIZE + CELL_SIZE / 2;
        const cy = cell.y * CELL_SIZE + CELL_SIZE / 2;

        ctx.save();
        ctx.translate(cx, cy);

        if (gameState.laserDir === 'up' || gameState.laserDir === 'down') {
          ctx.rotate(Math.PI / 2);
        }

        if (imgLaser && imgLaser.complete && imgLaser.naturalWidth > 0) {
          ctx.drawImage(imgLaser, -CELL_SIZE / 2, -CELL_SIZE / 2, CELL_SIZE, CELL_SIZE);
        } else {
          ctx.fillStyle = '#00a8ff';
          ctx.fillRect(-CELL_SIZE / 2, -CELL_SIZE / 2, CELL_SIZE, CELL_SIZE);
        }

        ctx.restore();
      });

      Object.values(gameState.players).forEach(p => {
        if (!p.alive) return;
        
        let currentPlayerImg = imgPlayer1;
        if (p.playerNumber === 2) currentPlayerImg = imgPlayer2;
        if (p.playerNumber === 3) currentPlayerImg = imgPlayer3;
        if (p.playerNumber === 4) currentPlayerImg = imgPlayer4;

        drawSafe(currentPlayerImg, p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

        if (p.hasElectricGun > 0) {
          drawAimArrow(p.x, p.y, p.facingDir);
        }

        if (p.hasShield) {
          ctx.beginPath();
          ctx.arc(p.x * CELL_SIZE + CELL_SIZE/2, p.y * CELL_SIZE + CELL_SIZE/2, CELL_SIZE/2 + 2, 0, 2*Math.PI);
          ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = 'rgba(52, 152, 219, 0.8)';
          ctx.stroke();
        }
      });

      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
