<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bomb It Multiplayer Web</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; }
    body {
      margin: 0; background: #222; color: #fff; font-family: sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #lobby { text-align: center; }
    #lobby img { width: 180px; height: 180px; border-radius: 8px; margin: 10px 0; }
    #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }
    
    #hud {
      display: flex; width: 100%; justify-content: space-between; align-items: center;
      background: #444; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px;
      font-size: 20px; font-weight: bold; border: 3px solid #333;
    }
    #hud-stats { display: flex; gap: 15px; }
    .buff-count { font-size: 13px; color: #55efc4; margin-left: 2px; }
    
    .btn-restart {
      background: #00b894; color: white; border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;
    }
    .btn-restart:active { background: #00cec9; }
    
    canvas { border: 4px solid #333; border-radius: 8px; max-width: 90vw; }
    
    .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-gap: 10px; margin-top: 15px; }
    .btn {
      width: 60px; height: 60px; background: #444; border: none; border-radius: 12px;
      color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center;
      justify-content: center; user-select: none; cursor: pointer;
    }
    .btn:active { background: #666; }
    .btn-bomb { background: #e74c3c; grid-column: 2; }
  </style>
</head>
<body>

  <div id="lobby">
    <h2>Quét mã QR để cùng chơi!</h2>
    <img id="qr-img" alt="QR Code" />
    <p>Phòng: <span id="room-display" style="font-weight: bold; color: #f1c40f;"></span></p>
    <button onclick="startGame()" style="padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; background: #0984e3; color: white; border: none;">Vào Trận</button>
  </div>

  <div id="game-container">
    <div id="hud">
      <div id="hud-stats"></div>
      <button class="btn-restart" onclick="sendRestart()">🔄 Chơi Lại</button>
    </div>

    <canvas id="canvas" width="600" height="520"></canvas>
    
    <div class="controls">
      <div></div><button class="btn" onclick="sendMove('up')">▲</button><div></div>
      <button class="btn" onclick="sendMove('left')">◀</button>
      <button class="btn btn-bomb" onclick="sendBomb()">💣</button>
      <button class="btn" onclick="sendMove('right')">▶</button>
      <div></div><button class="btn" onclick="sendMove('down')">▼</button><div></div>
    </div>
  </div>

  <script>
    const imgWall = new Image(); imgWall.src = '/assets/wall.png';
    const imgBrick = new Image(); imgBrick.src = '/assets/brick.png';
    const imgBomb = new Image(); imgBomb.src = '/assets/bomb.png';
    const imgItemBomb = new Image(); imgItemBomb.src = '/assets/item-bomb.png';
    const imgItemFire = new Image(); imgItemFire.src = '/assets/item-fire.png';
    
    // HOÀN TÁC: Trở về dùng ảnh ô cỏ gốc
    const imgGrass = new Image(); imgGrass.src = '/assets/grass.png';

    const imgPlayer1 = new Image(); imgPlayer1.src = '/assets/player1.png';
    const imgPlayer2 = new Image(); imgPlayer2.src = '/assets/player2.png';
    const imgPlayer3 = new Image(); imgPlayer3.src = '/assets/player3.png';
    const imgPlayer4 = new Image(); imgPlayer4.src = '/assets/player4.png';

    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'PHONG-VUI';

    socket.emit('join_room', { roomId, hostUrl: window.location.origin });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const CELL_SIZE = 40;

    let gameState = { map: [], players: {}, bombs: [], explosions: [] };

    function updateHUD() {
      const myPlayer = gameState.players[socket.id];
      if (myPlayer) {
        if (myPlayer.alive) {
          const bombCharge = myPlayer.bombBuffCharges > 0 ? `<span class="buff-count">(${myPlayer.bombBuffCharges})</span>` : '';
          const fireCharge = myPlayer.fireBuffCharges > 0 ? `<span class="buff-count">(${myPlayer.fireBuffCharges})</span>` : '';

          document.getElementById('hud-stats').innerHTML = `
            <div>❤️ <span>${myPlayer.lives}</span></div>
            <div>💣 <span>${myPlayer.bombLimit}</span>${bombCharge}</div>
            <div>🔥 <span>${myPlayer.bombPower}</span>${fireCharge}</div>
          `;
        } else {
          document.getElementById('hud-stats').innerHTML = "<div style='color:#ff7675;'>💀 ĐÃ TỬ TRẬN</div>";
        }
      }
    }

    socket.on('room_state', (data) => {
      document.getElementById('qr-img').src = data.qrCode;
      document.getElementById('room-display').innerText = data.roomId;
      gameState.map = data.map;
      gameState.players = data.players;
      updateHUD();
    });

    socket.on('game_restarted', (data) => {
      gameState.map = data.map;
      gameState.players = data.players;
      gameState.bombs = [];       
      gameState.explosions = [];  
      updateHUD();                
    });

    socket.on('player_moved', ({ id, x, y }) => {
      if (gameState.players[id]) {
        gameState.players[id].x = x;
        gameState.players[id].y = y;
      }
    });

    socket.on('player_updated', (updatedPlayer) => {
      gameState.players[updatedPlayer.id] = updatedPlayer;
      if (updatedPlayer.id === socket.id) updateHUD();
    });

    socket.on('map_updated', (updatedMap) => {
      gameState.map = updatedMap;
    });

    socket.on('bomb_placed', (bomb) => {
      gameState.bombs.push(bomb);
    });

    socket.on('bomb_exploded', ({ bombId, explosionCells, updatedMap, players }) => {
      gameState.bombs = gameState.bombs.filter(b => b.id !== bombId);
      gameState.map = updatedMap;
      gameState.players = players;
      gameState.explosions = explosionCells;
      updateHUD(); 
      setTimeout(() => { gameState.explosions = []; }, 400);
    });

    function sendMove(dir) { socket.emit('move', { roomId, dir }); }
    function sendBomb() { socket.emit('place_bomb', { roomId }); }
    function sendRestart() { socket.emit('restart_game', { roomId }); }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') sendMove('up');
      if (e.key === 'ArrowDown' || e.key === 's') sendMove('down');
      if (e.key === 'ArrowLeft' || e.key === 'a') sendMove('left');
      if (e.key === 'ArrowRight' || e.key === 'd') sendMove('right');
      if (e.key === ' ' || e.key === 'Enter') sendBomb();
    });

    function startGame() {
      document.getElementById('lobby').style.display = 'none';
      document.getElementById('game-container').style.display = 'flex';
      updateHUD();
      requestAnimationFrame(render);
    }

    function drawSafe(img, x, y, w, h) {
      if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
      } else {
        // Đổ màu xanh lá mạ dự phòng nếu thiếu ảnh grass.png
        ctx.fillStyle = (img === imgGrass) ? '#78e08f' : '#e84118';
        ctx.fillRect(x, y, w, h);
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let r = 0; r < gameState.map.length; r++) {
        for (let c = 0; c < gameState.map[r].length; c++) {
          const tile = gameState.map[r][c];
          
          // HOÀN TÁC: Vẽ cỏ từng ô (Sử dụng drawSafe)
          drawSafe(imgGrass, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          
          if (tile === 1) drawSafe(imgWall, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 2) drawSafe(imgBrick, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 3) drawSafe(imgItemBomb, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          else if (tile === 4) drawSafe(imgItemFire, c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      }

      gameState.bombs.forEach(b => {
        drawSafe(imgBomb, b.x * CELL_SIZE, b.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      ctx.fillStyle = 'rgba(255, 118, 117, 0.8)';
      gameState.explosions.forEach(exp => {
        ctx.fillRect(exp.x * CELL_SIZE, exp.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      Object.values(gameState.players).forEach(p => {
        if (!p.alive) return;
        
        let currentPlayerImg = imgPlayer1;
        if (p.playerNumber === 2) currentPlayerImg = imgPlayer2;
        if (p.playerNumber === 3) currentPlayerImg = imgPlayer3;
        if (p.playerNumber === 4) currentPlayerImg = imgPlayer4;

        drawSafe(currentPlayerImg, p.x * CELL_SIZE, p.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      });

      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
